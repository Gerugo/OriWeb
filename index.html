<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ori Mechanics Test Chamber | AAA Character Controller</title>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var banner = document.getElementById('err-banner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'err-banner';
                banner.style.position = 'fixed';
                banner.style.top = '0';
                banner.style.left = '0';
                banner.style.right = '0';
                banner.style.background = '#ef4444';
                banner.style.color = '#fff';
                banner.style.padding = '12px 18px';
                banner.style.fontFamily = 'monospace';
                banner.style.fontSize = '13px';
                banner.style.zIndex = '99999';
                document.body.appendChild(banner);
            }
            banner.innerText = 'Error detectado: ' + msg + ' (en ' + (url ? url.split('/').pop() : 'script') + ':' + line + ')';
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Minimalist Modern HUD */
        #hud-overlay {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 260px;
        }

        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hud-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glow-dot {
            width: 8px;
            height: 8px;
            background-color: #0ea5e9;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .hud-meta {
            font-family: monospace;
            font-size: 11px;
            color: #64748b;
        }

        .hud-state-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-state-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .hud-state-val {
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .badges-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 3px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .badge.ready {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        .badge.used {
            background-color: #f1f5f9;
            color: #94a3b8;
            border: 1px solid #e2e8f0;
        }

        /* Controls Bottom Bar */
        #controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 30px;
            padding: 10px 24px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #334155;
            font-weight: 600;
        }

        .kbd {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 11px;
            color: #0f172a;
        }

        .separator {
            width: 1px;
            height: 18px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD Overlay -->
    <div id="hud-overlay">
        <div class="hud-card">
            <div class="hud-header">
                <span class="hud-title">
                    <span class="glow-dot"></span>
                    ORI MECHANICS PROVING GROUND
                </span>
            </div>
            <div class="hud-state-row">
                <span class="hud-state-label">STATE:</span>
                <span id="hud-state" class="hud-state-val">IDLE</span>
            </div>
            <div id="hud-vel" class="hud-meta">Vx: 0 | Vy: 0</div>
            <div class="badges-row">
                <span id="hud-dj" class="badge ready">Double Jump: READY</span>
                <span id="hud-dash" class="badge ready">Dash: READY</span>
                <span id="hud-coyote" class="badge ready">Coyote: 130ms</span>
            </div>
        </div>
    </div>

    <!-- Controls Bottom Legend -->
    <div id="controls-bar">
        <div class="key-hint"><span class="kbd">A / D</span> Correr</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">SPACE</span> Salto / Doble / Planeo</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">Pared + Space</span> Wall Kick</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">C / SHIFT</span> Dash 8-Dir</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">Click Dcho / B</span> BASH (Slingshot)</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">Click Izq / X</span> Espada de Luz</div>
        <div class="separator"></div>
        <div class="key-hint"><span class="kbd">S en el aire</span> STOMP</div>
    </div>

    <!-- Scripts -->
    <script src="phaser.min.js"></script>
    <script src="assets_data.js"></script>
    <script src="src/config.js"></script>
    <script src="src/animations.js"></script>
    <script src="src/vfx.js"></script>
    <script src="src/parallax.js"></script>
    <script src="src/platform_art.js"></script>
    <script src="src/enemies.js"></script>
    <script src="src/level.js"></script>
    <script src="src/player.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
